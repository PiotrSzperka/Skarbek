version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: skarbek
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: skarbek
    volumes:
      - db-data:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://skarbek:changeme@db:5432/skarbek
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=changeme
      - JWT_SECRET=devsecret
      - EMAIL_BACKEND=console
      # To use Gmail API in non-local environments, set these four vars:
      # - GMAIL_CLIENT_ID=...
      # - GMAIL_CLIENT_SECRET=...
      # - GMAIL_REFRESH_TOKEN=...
      # - GMAIL_SENDER_EMAIL=you@domain
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
